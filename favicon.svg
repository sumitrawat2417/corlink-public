<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca"/>
      <stop offset="50%" stop-color="#5e52fc"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5e52fc"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Smartwatch Case Squircle -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="2.5"/>

  <!-- Screen Bezel -->
  <rect x="10" y="10" width="44" height="44" rx="11" fill="#090a10" stroke="#1f2333" stroke-width="1.2"/>

  <!-- Radial BLE Orbital Ring -->
  <circle cx="32" cy="32" r="14" stroke="#5e52fc" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Glowing Neural AI Core -->
  <circle cx="32" cy="32" r="8" fill="url(#coreGrad)" filter="url(#glow)"/>

  <!-- Core Lens Center Dot -->
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>

  <!-- Top Sensor Notch / Optical Dot -->
  <circle cx="32" cy="7.5" r="1.5" fill="#00f5ff"/>

  <!-- Corner Accent Micro-Markers -->
  <circle cx="14" cy="14" r="1" fill="#7928ca" opacity="0.7"/>
  <circle cx="50" cy="14" r="1" fill="#00f5ff" opacity="0.7"/>
  <circle cx="14" cy="50" r="1" fill="#00f5ff" opacity="0.7"/>
  <circle cx="50" cy="50" r="1" fill="#7928ca" opacity="0.7"/>
</svg>
